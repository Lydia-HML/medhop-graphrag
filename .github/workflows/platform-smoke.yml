name: Platform smoke checks

on:
  push:
  pull_request:

jobs:
  python-syntax:
    name: Python syntax (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        shell: bash
        run: python -m compileall -q app.py explore_medhop.py src graphrag_npu_0722 scripts
